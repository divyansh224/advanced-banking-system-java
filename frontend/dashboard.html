<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Dashboard | SecureBank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-bank">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🏦 SecureBank</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="transfer.html">Transfer</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html">Transactions</a></li>
                <li class="nav-item"><span class="nav-link" id="navUser"></span></li>
                <li class="nav-item"><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h3 class="mb-0">Welcome back, <span id="welcomeName">-</span> 👋</h3>
            <p class="text-muted mb-0">Here's a summary of your accounts.</p>
        </div>
        <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#newAccountModal">+ Open New Account</button>
    </div>

    <div class="row g-3 mb-4" id="accountsRow">
        <!-- Account cards injected here -->
    </div>

    <div id="noAccounts" class="card card-elevated d-none">
        <div class="card-body text-center py-5">
            <h5>You don't have any accounts yet</h5>
            <p class="text-muted">Open your first account to start banking.</p>
            <button class="btn btn-bank" data-bs-toggle="modal" data-bs-target="#newAccountModal">Open an Account</button>
        </div>
    </div>
</div>

<!-- New Account Modal -->
<div class="modal fade" id="newAccountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="newAccountForm">
                <div class="modal-header">
                    <h5 class="modal-title">Open a New Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Account Type</label>
                        <select class="form-select" id="accountType">
                            <option value="SAVINGS">Savings</option>
                            <option value="CURRENT">Current</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Initial Deposit (optional)</label>
                        <input type="number" min="0" step="0.01" class="form-control" id="initialDeposit" value="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-bank" id="createAccountBtn">Create Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="bank-footer">&copy; 2026 SecureBank. Demo project for portfolio purposes.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
