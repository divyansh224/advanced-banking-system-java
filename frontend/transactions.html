<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Transaction History | SecureBank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-bank">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🏦 SecureBank</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="transfer.html">Transfer</a></li>
                <li class="nav-item"><a class="nav-link active" href="transactions.html">Transactions</a></li>
                <li class="nav-item"><span class="nav-link" id="navUser"></span></li>
                <li class="nav-item"><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h4 class="mb-0">Transaction History</h4>
        <div class="d-flex gap-2 align-items-center">
            <label class="mb-0 text-muted small">Account:</label>
            <select class="form-select form-select-sm" id="accountSelect" style="min-width:220px;"></select>
        </div>
    </div>

    <div class="card card-elevated">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle table-transactions">
                    <thead>
                        <tr>
                            <th>Txn ID</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="txnBody">
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center text-muted py-5 d-none">
                No transactions yet for this account.
            </div>
        </div>
    </div>
</div>

<footer class="bank-footer">&copy; 2026 SecureBank. Demo project for portfolio purposes.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
