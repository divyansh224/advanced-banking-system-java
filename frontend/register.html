<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | SecureBank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-bank">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏦 SecureBank</a>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-header">
            <h4 class="mb-0">Create Your Account</h4>
            <small>Join SecureBank in a minute</small>
        </div>
        <div class="card-body p-4">
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" minlength="4" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phoneNumber">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-bank w-100 py-2" id="registerBtn">Create Account</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already registered? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>
</div>

<footer class="bank-footer">&copy; 2026 SecureBank. Demo project for portfolio purposes.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
