<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | SecureBank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-bank">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏦 SecureBank</a>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-header">
            <h4 class="mb-0">Welcome Back</h4>
            <small>Log in to your SecureBank account</small>
        </div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-bank w-100 py-2" id="loginBtn">Log In</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
        </div>
    </div>
</div>

<footer class="bank-footer">&copy; 2026 SecureBank. Demo project for portfolio purposes.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
