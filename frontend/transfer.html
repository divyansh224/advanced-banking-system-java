<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Transfer Money | SecureBank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-bank">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🏦 SecureBank</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="transfer.html">Transfer</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html">Transactions</a></li>
                <li class="nav-item"><span class="nav-link" id="navUser"></span></li>
                <li class="nav-item"><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-elevated">
                <div class="card-body p-4">
                    <h4 class="mb-1">Transfer Money</h4>
                    <p class="text-muted">Send funds securely between accounts.</p>

                    <form id="transferForm" class="mt-3">
                        <div class="mb-3">
                            <label class="form-label">From Account</label>
                            <select class="form-select" id="fromAccount" required></select>
                            <div class="form-text" id="fromBalanceHint"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">To Account Number</label>
                            <input type="text" class="form-control" id="toAccountNumber" placeholder="Enter recipient's account number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (USD)</label>
                            <input type="number" min="0.01" step="0.01" class="form-control" id="amount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description (optional)</label>
                            <input type="text" class="form-control" id="description" placeholder="e.g. Rent payment">
                        </div>
                        <button type="submit" class="btn btn-bank w-100 py-2" id="transferBtn">Send Transfer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Transfer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-accent" id="confirmBtn">Confirm & Send</button>
            </div>
        </div>
    </div>
</div>

<footer class="bank-footer">&copy; 2026 SecureBank. Demo project for portfolio purposes.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/transfer.js"></script>
</body>
</html>
